    <!-- Instant Synchronous Route & Document Title Resolution for zero-latency tab title on all routes -->
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          var p = window.location.pathname.replace(/\/+$/, '') || '/';
          var savedRoute = sessionStorage.getItem('kan_active_route');
          var isReload = false;
          try {
            var nav = performance.getEntriesByType('navigation')[0];
            if (nav && nav.type === 'reload') isReload = true;
            if (window.performance && window.performance.navigation && window.performance.navigation.type === 1) isReload = true;
          } catch (e) {}
          var inIframe = window.self !== window.top;

          if ((p === '/' || p === '/kan') && savedRoute && savedRoute !== '/' && savedRoute !== '/kan' && (isReload || inIframe)) {
            window.history.replaceState(null, '', savedRoute);
            p = savedRoute.replace(/\/+$/, '') || '/';
          }

          if (p === '/' || p === '/kan') {
            document.title = 'HOME - KAN SPACE';
          } else if (p.indexOf('/work/') === 0) {
            var raw = p.slice(6).split('?')[0].split('#')[0];
            var slug = decodeURIComponent(raw).toLowerCase().trim();
            if (slug.indexOf('ayub') !== -1) document.title = 'Ayubyayulestariofficial - KAN SPACE';
            else if (slug.indexOf('byayu') !== -1) document.title = 'Byayudyahandari - KAN SPACE';
            else if (slug.indexOf('oase') !== -1) document.title = 'OASE "Desert Of Dubai" - KAN SPACE';
            else if (slug.indexOf('filmmaking') !== -1) document.title = 'Sony Filmmaking Experience - KAN SPACE';
            else if (slug.indexOf('immateur') !== -1) document.title = 'Immateurplayground - KAN SPACE';
            else if (slug.indexOf('festival') !== -1) document.title = 'Sony Alpha Festival 2026 - KAN SPACE';
            else document.title = 'Work - KAN SPACE';
          } else if (p === '/work' || p === '/works') {
            document.title = 'Work - KAN SPACE';
          } else if (p === '/about') {
            document.title = 'About - KAN SPACE';
          } else if (p === '/artist/arkantaqiyuddin' || p === '/arkan' || p === '/arkantaqiyuddin') {
            document.title = 'Arkan Taqiyuddin - Colorist - KAN SPACE';
          } else if (p === '/artist' || p.indexOf('/artist/') === 0) {
            document.title = 'Artist - KAN SPACE';
          }
        } catch (e) {}
      })();
    </script>
